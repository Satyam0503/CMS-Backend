# Codeji CMS Backend Pipeline (.NET 10.0)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - "*"

# Environment configuration - add new environments here
parameters:
  - name: environments
    type: object
    default:
      - name: test
        branch: develop
        environment: Development
      - name: prod
        branch: main
        environment: Production

variables:
  solution: "CodejiCMSCore.sln"
  buildPlatform: "Any CPU"
  buildConfiguration: "Release"
  dotnetVersion: "10.0.x"

stages:
  # ============================================
  # Build Stage
  # ============================================
  - stage: Build
    displayName: "Build Backend"
    pool:
      name: Codeji-Pool
    jobs:
      - job: BuildJob
        displayName: "Build and Publish"
        steps:
          - checkout: self
            fetchDepth: 1

          - task: UseDotNet@2
            displayName: "Install .NET 10.0 SDK"
            inputs:
              version: "$(dotnetVersion)"

          - task: DotNetCoreCLI@2
            displayName: "Restore NuGet Packages"
            inputs:
              command: "restore"
              projects: "$(solution)"

          - task: DotNetCoreCLI@2
            displayName: "Build Solution"
            inputs:
              command: "build"
              projects: "$(solution)"
              arguments: "--configuration $(buildConfiguration) --no-restore"

          - task: DotNetCoreCLI@2
            displayName: "Run Unit Tests"
            inputs:
              command: "test"
              projects: "**/*Tests/*.csproj"
              arguments: '--configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage"'
            continueOnError: true

          - task: DotNetCoreCLI@2
            displayName: "Publish API (zipped)"
            inputs:
              command: "publish"
              publishWebProjects: false
              projects: "Codeji.CMS.API/Codeji.CMS.API.csproj"
              arguments: "--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/api"
              zipAfterPublish: true

          - task: DotNetCoreCLI@2
            displayName: "Publish Migrations Runner"
            inputs:
              command: "publish"
              publishWebProjects: false
              projects: "Codeji.CMS.Migrations/Codeji.CMS.Migrations.csproj"
              arguments: "--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/Codeji.CMS.Migrations"
              zipAfterPublish: false
              modifyOutputPath: false

          - task: CopyFiles@2
            displayName: "Copy Deployment Scripts"
            inputs:
              SourceFolder: ".pipelines"
              Contents: "**"
              TargetFolder: "$(Build.ArtifactStagingDirectory)/.pipelines"

          - task: PublishBuildArtifacts@1
            displayName: "Publish Artifacts"
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)"
              ArtifactName: "backend-drop"
              publishLocation: "Container"

          - task: PowerShell@2
            displayName: "Cleanup build workspace"
            condition: always()
            inputs:
              targetType: "inline"
              script: |
                foreach ($p in @("$(Build.ArtifactStagingDirectory)", "$(Build.SourcesDirectory)")) {
                  if (Test-Path $p) {
                    Remove-Item -Path "$p\*" -Recurse -Force -ErrorAction SilentlyContinue
                    Write-Host "Cleaned $p"
                  }
                }

  # ============================================
  # Deploy Stages - generated from environments
  # ============================================
  - ${{ each env in parameters.environments }}:
      - stage: Deploy${{ env.name }}
        displayName: "Deploy to ${{ env.name }}"
        dependsOn: Build
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/${{ env.branch }}'))
        variables:
          - group: codeji-${{ env.name }}
        jobs:
          - deployment: DeployTo${{ env.name }}
            displayName: "Deploy to ${{ env.name }} VM"
            environment: "Development.CODEJI-SERVER"
            strategy:
              runOnce:
                deploy:
                  steps:
                    - download: current
                      artifact: "backend-drop"

                    - task: ExtractFiles@1
                      displayName: "Extract API zip to staging"
                      inputs:
                        archiveFilePatterns: "$(Pipeline.Workspace)/backend-drop/api/Codeji.CMS.API.zip"
                        destinationFolder: "$(Pipeline.Workspace)/api-staging"
                        cleanDestinationFolder: true

                    - task: PowerShell@2
                      displayName: "Resolve URLs from AppSettings"
                      inputs:
                        targetType: "inline"
                        script: |
                          # Tolerant hostname extraction: matches anything between :// and the
                          # first / or \, so trailing slashes (forward or back) don't break parsing.
                          $apiUrlRaw = "$(AppSettings.APIUrl)"
                          if ($apiUrlRaw -notmatch '^https?://([^/\\?#]+)') {
                            throw "Could not parse hostname from AppSettings.APIUrl: '$apiUrlRaw'"
                          }
                          $apiHost = $matches[1]
                          Write-Host "##vso[task.setvariable variable=ApiHost]$apiHost"
                          Write-Host "Resolved: ApiHost=$apiHost"

                    - task: PowerShell@2
                      displayName: "Run Database Migrations"
                      inputs:
                        targetType: "inline"
                        script: |
                          $migrationsDir = "$(Pipeline.Workspace)\backend-drop\Codeji.CMS.Migrations"
                          if (-not (Test-Path "$migrationsDir\Codeji.CMS.Migrations.exe")) {
                            throw "Migrations executable not found at $migrationsDir"
                          }

                          # Inject env-specific Mongo connection string into the runner's appsettings.json
                          $appsettings = @{
                              ConnectionStrings = @{
                                  mongodb = "$(MongoDB.ConnectionString)"
                              }
                          }
                          $appsettings | ConvertTo-Json -Depth 10 |
                            Out-File "$migrationsDir\appsettings.json" -Encoding UTF8 -Force

                          Write-Host "Running migrations..."
                          & "$migrationsDir\Codeji.CMS.Migrations.exe"
                          if ($LASTEXITCODE -ne 0) {
                            throw "Migrations runner exited with code $LASTEXITCODE"
                          }
                          Write-Host "Migrations completed successfully"

                    - task: PowerShell@2
                      displayName: "Generate appsettings.${{ env.environment }}.json"
                      inputs:
                        targetType: "filePath"
                        filePath: "$(Pipeline.Workspace)/backend-drop/.pipelines/scripts/generate-appsettings.ps1"
                        arguments: >
                          -Environment "${{ env.environment }}"
                          -OutputPath "$(Pipeline.Workspace)/api-staging"
                          -BuildNumber "$(Build.BuildNumber)"
                          -IsForDebug "$(AppSettings.isForDebug)"
                          -MongoConnectionString "$(MongoDB.ConnectionString)"
                          -JwtSecretKey "$(Jwt.SecretKey)"
                          -JwtExpiry "$(Jwt.Expiry)"
                          -EmailHost "$(EmailSettings.Host)"
                          -EmailPort $(EmailSettings.Port)
                          -EmailFromName "$(EmailSettings.FromName)"
                          -EmailFromEmail "$(EmailSettings.FromEmail)"
                          -EmailSecretKey "$(EmailSettings.SecretKey)"
                          -ReCaptchaSecretKey "$(ReCaptcha.SecretKey)"
                          -APIUrl "$(AppSettings.APIUrl)"
                          -AppUrl "$(AppSettings.AppUrl)"

                    - task: PowerShell@2
                      displayName: "Deploy API to ${{ env.name }} IIS"
                      inputs:
                        targetType: "inline"
                        script: |
                          $siteName = "crm-${{ env.name }}-api"
                          $deployPath = "$(DeployRoot)\crm-${{ env.name }}\backend\Codeji.CMS.API"

                          Write-Host "=========================================="
                          Write-Host "Deploying API to ${{ env.name }}"
                          Write-Host "   Site:     $siteName"
                          Write-Host "   Pool:     $siteName"
                          Write-Host "   Host:     $(ApiHost)"
                          Write-Host "   Path:     $deployPath"
                          Write-Host "=========================================="

                          # Setup IIS Website (creates app pool, site, and host-header binding; stops pool to release locks)
                          & "$(Pipeline.Workspace)/backend-drop/.pipelines/scripts/setup-iis-website.ps1" `
                            -SiteName $siteName `
                            -PhysicalPath $deployPath `
                            -Port 80 `
                            -HostName "$(ApiHost)" `
                            -AppPoolName $siteName

                          # Copy application files - preserve runtime Uploads folder on the server.
                          # Robocopy /E (incl. empty subdirs) /XD excludes the Uploads tree at any case.
                          # Robocopy exit codes 0-7 are success; >=8 is failure.
                          $src = "$(Pipeline.Workspace)\api-staging"
                          robocopy $src $deployPath /E /XD "$src\Uploads" "$src\uploads" /NFL /NDL /NJH /NJS /NP
                          if ($LASTEXITCODE -ge 8) {
                            throw "robocopy failed with exit code $LASTEXITCODE"
                          }
                          $global:LASTEXITCODE = 0

                          # Ensure required runtime upload directories exist (first deploy only).
                          foreach ($d in @("Uploads", "Uploads\ProfileImage", "Uploads\Resume")) {
                            $p = Join-Path $deployPath $d
                            if (-not (Test-Path $p)) { New-Item -Path $p -ItemType Directory -Force | Out-Null }
                          }

                          # Deploy migrations runner to a sibling folder of the API.
                          # Clean copy each time so old DLLs from prior releases don't linger.
                          $migrationsSrc  = "$(Pipeline.Workspace)\backend-drop\Codeji.CMS.Migrations"
                          $migrationsPath = "$(DeployRoot)\crm-${{ env.name }}\backend\Codeji.CMS.Migrations"
                          if (Test-Path $migrationsPath) {
                            Remove-Item -Path $migrationsPath -Recurse -Force
                          }
                          robocopy $migrationsSrc $migrationsPath /E /NFL /NDL /NJH /NJS /NP
                          if ($LASTEXITCODE -ge 8) {
                            throw "robocopy (migrations) failed with exit code $LASTEXITCODE"
                          }
                          $global:LASTEXITCODE = 0

                          # Run migrations BEFORE starting the app pool. A non-zero exit throws,
                          # so a failed migration aborts the deployment with the previous version
                          # still serving traffic (app pool stays stopped).
                          & "$(Pipeline.Workspace)/backend-drop/.pipelines/scripts/run-migrations.ps1" `
                            -MigrationsPath $migrationsPath `
                            -MongoConnectionString "$(MongoDB.ConnectionString)"

                          # Start application pool
                          & "$(Pipeline.Workspace)/backend-drop/.pipelines/scripts/start-iis-apppool.ps1" -AppPoolName $siteName

                          Write-Host "=========================================="
                          Write-Host "${{ env.name }} deployment completed!"
                          Write-Host "=========================================="

                    - task: PowerShell@2
                      displayName: "Cleanup downloaded artifact"
                      condition: always()
                      inputs:
                        targetType: "inline"
                        script: |
                          foreach ($p in @("$(Pipeline.Workspace)\backend-drop", "$(Pipeline.Workspace)\api-staging")) {
                            if (Test-Path $p) {
                              Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue
                              Write-Host "Cleaned up $p"
                            }
                          }
