  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 24px 32px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 16px;
  }

  .header-title {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .header-title h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }

  .header-title .entity-count {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-tertiary);
    background: var(--tag-bg);
    padding: 2px 10px;
    border-radius: 12px;
  }

  .header-stats {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .stat-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid;
  }

  .stat-badge.critical { background: var(--issue-critical-bg); border-color: var(--issue-critical-border); color: var(--issue-critical-text); }
  .stat-badge.high { background: var(--issue-high-bg); border-color: var(--issue-high-border); color: var(--issue-high-text); }
  .stat-badge.medium { background: var(--issue-medium-bg); border-color: var(--issue-medium-border); color: var(--issue-medium-text); }
  .stat-badge.low { background: var(--issue-low-bg); border-color: var(--issue-low-border); color: var(--issue-low-text); }

  .stat-badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .header-controls {
    display: flex;
    gap: 12px;
    align-items: stretch;
    flex-wrap: wrap;
  }

  .search-box {
    position: relative;
    flex: 1 1 280px;
    min-width: 200px;
  }

  .search-box input {
    width: 100%;
    padding: 8px 12px 8px 36px;
    border: 1px solid var(--search-border);
    border-radius: 8px;
    background: var(--search-bg);
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-box input:focus {
    border-color: var(--accent);
  }

  .search-box input::placeholder {
    color: var(--text-tertiary);
  }

  .search-box svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-tertiary);
    pointer-events: none;
  }

  .filter-group {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-btn {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--filter-bg);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .filter-btn:hover {
    border-color: var(--accent);
    color: var(--text-primary);
  }

  .filter-btn.active {
    background: var(--filter-active-bg);
    color: var(--filter-active-text);
    border-color: var(--filter-active-bg);
  }

  .domain-filters {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-items: center;
    padding-top: 12px;
    border-top: 1px solid var(--border-light);
  }

  .domain-btn {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .domain-btn .domain-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .domain-btn:hover {
    background: var(--tag-bg);
  }

  .domain-btn.active {
    border-color: var(--accent);
    color: var(--text-primary);
    background: var(--tag-bg);
  }

  .content {
    padding: 24px 32px 48px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .visible-count {
    font-size: 13px;
    color: var(--text-tertiary);
    margin-bottom: 16px;
    font-weight: 500;
  }

  .domain-section {
    margin-bottom: 32px;
  }

  .domain-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--border-light);
  }

  .domain-header .domain-color-bar {
    width: 4px;
    height: 24px;
    border-radius: 2px;
  }

  .domain-header h2 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .domain-header .domain-count {
    font-size: 12px;
    color: var(--text-tertiary);
    font-weight: 500;
    background: var(--tag-bg);
    padding: 1px 8px;
    border-radius: 10px;
  }

  .entity-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 12px;
  }

  .entity-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--card-shadow);
    transition: box-shadow 0.2s, border-color 0.2s;
  }

  .entity-card:hover {
    box-shadow: var(--card-shadow-hover);
  }

  .entity-card.has-issues {
    border-left: 3px solid;
  }

  .entity-card.issue-critical { border-left-color: var(--issue-critical-border); }
  .entity-card.issue-high { border-left-color: var(--issue-high-border); }
  .entity-card.issue-medium { border-left-color: var(--issue-medium-border); }
  .entity-card.issue-low { border-left-color: var(--issue-low-border); }

  .card-header {
    padding: 12px 16px;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    user-select: none;
  }

  .card-header:hover {
    background: var(--tag-bg);
  }

  .card-header-left {
    flex: 1;
    min-width: 0;
  }

  .card-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .card-name .domain-tag {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 1px 6px;
    border-radius: 4px;
  }

  .card-meta {
    display: flex;
    gap: 8px;
    margin-top: 4px;
    flex-wrap: wrap;
  }

  .meta-tag {
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 500;
  }

  .meta-tag.base { background: var(--tag-bg); color: var(--accent); }
  .meta-tag.standalone { background: var(--tag-bg); color: var(--text-tertiary); }
  .meta-tag.tenant { background: var(--tag-bg); color: var(--domain-leave); }
  .meta-tag.no-tenant { background: var(--issue-medium-bg); color: var(--issue-medium-text); }
  .meta-tag.field-count { background: var(--tag-bg); color: var(--text-tertiary); }

  .expand-icon {
    color: var(--expand-icon);
    transition: transform 0.2s;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .entity-card.expanded .expand-icon {
    transform: rotate(180deg);
  }

  .card-body {
    display: none;
    border-top: 1px solid var(--border-light);
    padding: 0;
  }

  .entity-card.expanded .card-body {
    display: block;
  }

  .issue-banner {
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.4;
    border-bottom: 1px solid var(--border-light);
  }

  .issue-banner.critical { background: var(--issue-critical-bg); color: var(--issue-critical-text); }
  .issue-banner.high { background: var(--issue-high-bg); color: var(--issue-high-text); }
  .issue-banner.medium { background: var(--issue-medium-bg); color: var(--issue-medium-text); }
  .issue-banner.low { background: var(--issue-low-bg); color: var(--issue-low-text); }

  .issue-banner .issue-label {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 10px;
    margin-right: 6px;
  }

  .field-list {
    padding: 0;
    margin: 0;
    list-style: none;
  }

  .field-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 5px 16px;
    font-size: 13px;
    border-bottom: 1px solid var(--border-light);
  }

  .field-item:last-child {
    border-bottom: none;
  }

  .field-item:nth-child(even) {
    background: rgba(128,128,128,0.04);
  }

  .field-markers {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
    width: 30px;
    justify-content: flex-end;
  }

  .field-marker {
    font-size: 11px;
    font-weight: 700;
    border-radius: 3px;
    padding: 0 3px;
  }

  .field-marker.pk {
    color: var(--pk-color);
    font-size: 13px;
  }

  .field-marker.fk {
    color: var(--fk-color);
    font-size: 12px;
  }

  .field-name {
    font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-primary);
    flex-shrink: 0;
  }

  .field-type {
    font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    color: var(--field-type-color);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .field-attrs {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }

  .field-attr {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0 4px;
    border-radius: 3px;
    background: var(--tag-bg);
    color: var(--text-tertiary);
    white-space: nowrap;
  }

  .refs-section {
    padding: 8px 16px 10px;
    border-top: 1px solid var(--border-light);
    background: var(--code-bg);
  }

  .refs-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-tertiary);
    margin-bottom: 4px;
  }

  .ref-item {
    font-size: 12px;
    color: var(--fk-color);
    font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace;
    padding: 2px 0;
  }

  .ref-item span {
    color: var(--text-tertiary);
    font-size: 11px;
  }

  .no-results {
    text-align: center;
    padding: 64px 24px;
    color: var(--text-tertiary);
    font-size: 15px;
  }

  .no-results .no-results-icon {
    font-size: 40px;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  .highlight {
    background: rgba(45, 106, 79, 0.2);
    border-radius: 2px;
    padding: 0 1px;
  }

  @media (max-width: 768px) {
    .header { padding: 16px; }
    .content { padding: 16px 16px 40px; }
    .entity-grid { grid-template-columns: 1fr; }
    .header-top { flex-direction: column; align-items: flex-start; }
    .header-controls { width: 100%; }
    .search-box { flex: 1 1 100%; }
  }
</style>

<div class="header">

    </div>
    <div class="header-stats" id="headerStats"></div>
  </div>
  <div class="header-controls">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14.5 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="Search entities, fields, or types..." autocomplete="off" />

const DOMAIN_LABELS = {
  company: "Company",
  employees: "Employees",
  attendance: "Attendance",
  leave: "Leave",
  payroll: "Payroll",
  recruitment: "Recruitment",
  career: "Career Portal",
  roles: "Roles",
  calendar: "Calendar",
  holiday: "Holiday",
  notice: "Notice Board",
  notifications: "Notifications",
  auth: "Auth",
  email: "Email",
  system: "System"
};

const DOMAIN_ORDER = ["company","employees","attendance","leave","payroll","calendar","holiday","recruitment","career","roles","notice","notifications","auth","email","system"];

const issueCounts = { critical: 0, high: 0, medium: 0, low: 0 };
ENTITIES.forEach(function(e) {
  if (e.issues) e.issues.forEach(function(i) { issueCounts[i.severity]++; });
});

function renderHeaderStats() {
  var el = document.getElementById("headerStats");
  var html = "";
  var entries = [["critical", issueCounts.critical], ["high", issueCounts.high], ["medium", issueCounts.medium], ["low", issueCounts.low]];
  for (var i = 0; i < entries.length; i++) {
    if (entries[i][1] > 0) {
      html += '<span class="stat-badge ' + entries[i][0] + '"><span class="dot"></span>' + entries[i][1] + ' ' + entries[i][0] + '</span>';
    }
  }
  el.innerHTML = html;
}

function getHighestSeverity(entity) {
  if (!entity.issues || !entity.issues.length) return null;
  var order = ["critical","high","medium","low"];
  for (var i = 0; i < order.length; i++) {
    for (var j = 0; j < entity.issues.length; j++) {
      if (entity.issues[j].severity === order[i]) return order[i];
    }
  }
  return null;
}

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function highlightMatch(text, query) {
  if (!query) return escapeHtml(text);
  var escaped = escapeHtml(text);
  var q = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  var re = new RegExp("(" + q + ")", "gi");
  return escaped.replace(re, '<span class="highlight">$1</span>');
}

function entityMatchesSearch(entity, query) {
  if (!query) return true;
  var q = query.toLowerCase();
  if (entity.name.toLowerCase().indexOf(q) !== -1) return true;
  if (entity.domain.toLowerCase().indexOf(q) !== -1) return true;
  if (DOMAIN_LABELS[entity.domain] && DOMAIN_LABELS[entity.domain].toLowerCase().indexOf(q) !== -1) return true;
  for (var i = 0; i < entity.fields.length; i++) {
    if (entity.fields[i].name.toLowerCase().indexOf(q) !== -1) return true;
    if (entity.fields[i].type.toLowerCase().indexOf(q) !== -1) return true;
  }
  for (var j = 0; j < entity.refs.length; j++) {
    if (entity.refs[j].target.toLowerCase().indexOf(q) !== -1) return true;
  }
  if (entity.issues) {
    for (var k = 0; k < entity.issues.length; k++) {
      if (entity.issues[k].text.toLowerCase().indexOf(q) !== -1) return true;
    }
  }
  return false;
}

function entityMatchesFilter(entity, filter) {
  switch (filter) {
    case "all": return true;
    case "base": return entity.isBase;
    case "standalone": return !entity.isBase;
    case "no-tenant": return !entity.hasTenant;
    case "issues": return entity.issues && entity.issues.length > 0;
    default: return true;
  }
}

function renderEntityCard(entity, query) {
  var sev = getHighestSeverity(entity);
  var issueClass = sev ? "has-issues issue-" + sev : "";
  var domainColor = "var(--domain-" + entity.domain + ")";
  var domainBg = "var(--domain-" + entity.domain + "-bg)";

  var issuesHtml = "";
  if (entity.issues) {
    for (var i = 0; i < entity.issues.length; i++) {
      var issue = entity.issues[i];
      issuesHtml += '<div class="issue-banner ' + issue.severity + '"><span class="issue-label">' + issue.severity + '</span>' + highlightMatch(issue.text, query) + '</div>';
    }
  }

  var fieldsHtml = "";
  for (var fi = 0; fi < entity.fields.length; fi++) {
    var f = entity.fields[fi];
    var markers = "";
    if (f.pk) markers += '<span class="field-marker pk" title="Primary Key">&#x1f511;</span>';
    if (f.fk) markers += '<span class="field-marker fk" title="Foreign Key">&#x2192;</span>';

    var attrs = [];
    if (f.required) attrs.push("required");
    if (f.bsonId) attrs.push("BsonId");
    if (f.embedded) attrs.push("embedded");
    if (f.attrs) for (var ai = 0; ai < f.attrs.length; ai++) attrs.push(f.attrs[ai]);

    var attrsHtml = "";
    for (var ati = 0; ati < attrs.length; ati++) {
      attrsHtml += '<span class="field-attr">' + escapeHtml(attrs[ati]) + '</span>';
    }

    fieldsHtml += '<li class="field-item">' +
      '<span class="field-markers">' + markers + '</span>' +
      '<span class="field-name">' + highlightMatch(f.name, query) + '</span>' +
      '<span class="field-type">' + highlightMatch(f.type, query) + '</span>' +
      (attrsHtml ? '<span class="field-attrs">' + attrsHtml + '</span>' : '') +
      '</li>';
  }

  var refsHtml = "";
  if (entity.refs.length > 0) {
    var refItems = "";
    for (var ri = 0; ri < entity.refs.length; ri++) {
      var r = entity.refs[ri];
      refItems += '<div class="ref-item">' + highlightMatch(r.target, query) + ' <span>via ' + highlightMatch(r.via, query) + '</span></div>';
    }
    refsHtml = '<div class="refs-section"><div class="refs-title">References</div>' + refItems + '</div>';
  }

  var tenantLabel = entity.hasTenant
    ? '<span class="meta-tag tenant">Tenant</span>'
    : '<span class="meta-tag no-tenant">' + (entity.tenantNote ? escapeHtml(entity.tenantNote) : "No tenant") + '</span>';

  var baseLabel = entity.isBase
    ? '<span class="meta-tag base">BaseClass</span>'
    : '<span class="meta-tag standalone">Standalone</span>';

  return '<div class="entity-card ' + issueClass + '" data-entity-id="' + entity.id + '" data-domain="' + entity.domain + '">' +
    '<div class="card-header" onclick="toggleCard(this)">' +
      '<div class="card-header-left">' +
        '<div class="card-name">' +
          highlightMatch(entity.name, query) +
          ' <span class="domain-tag" style="background:' + domainBg + ';color:' + domainColor + '">' + (DOMAIN_LABELS[entity.domain] || entity.domain) + '</span>' +
        '</div>' +
        '<div class="card-meta">' + baseLabel + tenantLabel + '<span class="meta-tag field-count">' + entity.fields.length + ' fields</span></div>' +
      '</div>' +
      '<svg class="expand-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
    '</div>' +
    '<div class="card-body">' + issuesHtml + '<ul class="field-list">' + fieldsHtml + '</ul>' + refsHtml + '</div>' +
  '</div>';
}

function toggleCard(header) {
  header.closest(".entity-card").classList.toggle("expanded");
}

var currentFilter = "all";
var currentDomain = "all";
var currentQuery = "";

function render() {
  var container = document.getElementById("entityContainer");
  var noResults = document.getElementById("noResults");

  var filtered = [];
  for (var i = 0; i < ENTITIES.length; i++) {
    var e = ENTITIES[i];
    if (!entityMatchesFilter(e, currentFilter)) continue;
    if (currentDomain !== "all" && e.domain !== currentDomain) continue;
    if (!entityMatchesSearch(e, currentQuery)) continue;
    filtered.push(e);
  }

  document.getElementById("visibleCount").textContent =
    filtered.length === ENTITIES.length
      ? "Showing all " + ENTITIES.length + " entities"
      : "Showing " + filtered.length + " of " + ENTITIES.length + " entities";

  if (filtered.length === 0) {
    container.innerHTML = "";
    noResults.style.display = "block";
    return;
  }

  noResults.style.display = "none";

  var grouped = {};
  for (var gi = 0; gi < filtered.length; gi++) {
    var ent = filtered[gi];
    if (!grouped[ent.domain]) grouped[ent.domain] = [];
    grouped[ent.domain].push(ent);
  }

  var html = "";
  for (var di = 0; di < DOMAIN_ORDER.length; di++) {
    var domain = DOMAIN_ORDER[di];
    if (!grouped[domain]) continue;
    var entities = grouped[domain];
    var domainColor = "var(--domain-" + domain + ")";

    html += '<div class="domain-section">' +
      '<div class="domain-header">' +
        '<div class="domain-color-bar" style="background:' + domainColor + '"></div>' +
        '<h2>' + (DOMAIN_LABELS[domain] || domain) + '</h2>' +
        '<span class="domain-count">' + entities.length + '</span>' +
      '</div>' +
      '<div class="entity-grid">';

    for (var ei = 0; ei < entities.length; ei++) {
      html += renderEntityCard(entities[ei], currentQuery);
    }

    html += '</div></div>';
  }

  container.innerHTML = html;
}

function renderDomainFilters() {
  var el = document.getElementById("domainFilters");
  var html = '<button class="domain-btn active" data-domain="all">All Domains</button>';
  var domainCounts = {};
  for (var i = 0; i < ENTITIES.length; i++) {
    var d = ENTITIES[i].domain;
    domainCounts[d] = (domainCounts[d] || 0) + 1;
  }

  for (var di = 0; di < DOMAIN_ORDER.length; di++) {
    var domain = DOMAIN_ORDER[di];
    if (!domainCounts[domain]) continue;
    html += '<button class="domain-btn" data-domain="' + domain + '">' +
      '<span class="domain-dot" style="background:var(--domain-' + domain + ')"></span>' +
      (DOMAIN_LABELS[domain] || domain) + ' (' + domainCounts[domain] + ')' +
    '</button>';
  }
  el.innerHTML = html;
}

document.getElementById("searchInput").addEventListener("input", function(e) {
  currentQuery = e.target.value.trim();
  render();
});

document.getElementById("typeFilters").addEventListener("click", function(e) {
  var btn = e.target.closest(".filter-btn");
  if (!btn) return;
  var allBtns = document.getElementById("typeFilters").querySelectorAll(".filter-btn");
  for (var i = 0; i < allBtns.length; i++) allBtns[i].classList.remove("active");
  btn.classList.add("active");
  currentFilter = btn.getAttribute("data-filter");
  render();
});

document.getElementById("domainFilters").addEventListener("click", function(e) {
  var btn = e.target.closest(".domain-btn");
  if (!btn) return;
  var allBtns = document.getElementById("domainFilters").querySelectorAll(".domain-btn");
  for (var i = 0; i < allBtns.length; i++) allBtns[i].classList.remove("active");
  btn.classList.add("active");
  currentDomain = btn.getAttribute("data-domain");
  render();
});

document.addEventListener("keydown", function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === "k") {
    e.preventDefault();
    document.getElementById("searchInput").focus();
  }
  if (e.key === "Escape") {
    var input = document.getElementById("searchInput");
    if (document.activeElement === input) {
      input.value = "";
      currentQuery = "";
      render();
      input.blur();
    }
  }
});

renderHeaderStats();
renderDomainFilters();
render();
</script>
