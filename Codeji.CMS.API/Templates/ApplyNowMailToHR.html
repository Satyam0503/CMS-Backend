<html>
<head>
<meta charset="utf-8" />
<title>New applicant</title>
<style>
  body{font-family:Inter, Roboto, Arial, sans-serif;background:#f5f7fa;color:#1f2937}
  .card{max-width:720px;margin:28px auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 8px 18px rgba(16,24,40,0.06)}
  ul{margin:8px 0 0 16px}
</style>
</head>
<body>
  <div class="card">
    <h3>New application received</h3>
    <p>A new application has been submitted for <strong>[JobTitle]</strong>.</p>
    <ul>
      <li><strong>Candidate:</strong> [CandidateName]</li>
      <li><strong>Email:</strong> [CandidateEmail]</li>
      <li><strong>Phone:</strong> [CandidatePhone]</li>
    </ul>
  </div>
</body>
</html>
